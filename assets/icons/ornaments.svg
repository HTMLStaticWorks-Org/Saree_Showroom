<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Temple Border Motif -->
  <symbol id="temple-border-motif" viewBox="0 0 120 30">
    <path d="M0 30 L10 10 L20 30 L30 10 L40 30 L50 10 L60 30 L70 10 L80 30 L90 10 L100 30 L110 10 L120 30" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="10" cy="8" r="2" fill="currentColor"/>
    <circle cx="30" cy="8" r="2" fill="currentColor"/>
    <circle cx="50" cy="8" r="2" fill="currentColor"/>
    <circle cx="70" cy="8" r="2" fill="currentColor"/>
    <circle cx="90" cy="8" r="2" fill="currentColor"/>
    <circle cx="110" cy="8" r="2" fill="currentColor"/>
    <line x1="0" y1="30" x2="120" y2="30" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- Mango Buta / Paisley Motif -->
  <symbol id="mango-buta" viewBox="0 0 60 80">
    <path d="M30 5 C15 5 5 18 5 35 C5 55 22 70 35 78 C30 68 35 56 42 49 C49 42 52 33 50 24 C48 14 40 5 30 5 Z" fill="currentColor" opacity="0.95"/>
