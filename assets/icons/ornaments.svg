    <circle cx="100" cy="20" r="4" fill="#641C2D"/>
    <circle cx="80" cy="20" r="3" fill="currentColor"/>
    <circle cx="120" cy="20" r="3" fill="currentColor"/>
    <circle cx="68" cy="20" r="2" fill="currentColor"/>
    <circle cx="132" cy="20" r="2" fill="currentColor"/>
    <path d="M85 10 Q100 0 115 10 Q100 20 85 10 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M85 30 Q100 40 115 30 Q100 20 85 30 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
  </symbol>

  <!-- Peacock / Mayil Motif -->
  <symbol id="peacock-motif" viewBox="0 0 80 80">
    <path d="M25 60 C18 50 18 35 28 22 C32 17 38 15 42 18 C46 21 44 28 40 32 C36 36 34 42 38 48 C42 54 52 56 60 52 C65 49 68 44 68 38 C68 25 54 15 42 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="28" cy="22" r="3" fill="currentColor"/>
    <path d="M42 62 C45 68 52 72 62 70 C72 68 76 58 74 48 C72 40 65 35 60 38" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="62" cy="70" r="2" fill="currentColor"/>
    <circle cx="74" cy="48" r="2" fill="currentColor"/>
  </symbol>
</svg>

