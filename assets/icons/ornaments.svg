  </symbol>

  <!-- Kolam Heritage Centerpiece -->
  <symbol id="kolam-divider" viewBox="0 0 200 40">
    <path d="M0 20 L70 20 M130 20 L200 20" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
